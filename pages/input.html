<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内容输入</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2DE5F6 0%, #000618 100%);
            min-height: 100vh;
            color: #000618;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .simple-container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #000618;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            font-size: 16px;
            color: #6B7280;
            margin-bottom: 32px;
            font-weight: 400;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 24px;
        }

        .memory-textarea {
            width: 100%;
            min-height: 300px;
            padding: 24px;
            border: 2px solid #E5E7EB;
            border-radius: 16px;
            font-size: 16px;
            line-height: 1.6;
            font-family: inherit;
            color: #000618;
            background: #FAFBFC;
            resize: vertical;
            transition: all 0.3s ease;
        }

        .memory-textarea:focus {
            outline: none;
            border-color: #2DE5F6;
            background: white;
            box-shadow: 0 0 0 4px rgba(45, 229, 246, 0.15);
            transform: translateY(-1px);
        }

        .memory-textarea:hover {
            border-color: #C7D2FE;
            background: white;
        }

        .char-counter {
            position: absolute;
            bottom: 12px;
            right: 16px;
            font-size: 12px;
            color: #9CA3AF;
            background: rgba(255, 255, 255, 0.8);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .char-counter.warning {
            color: #F59E0B;
        }

        .char-counter.danger {
            color: #EF4444;
        }

        .action-buttons {
            display: flex;
            gap: 16px;
            margin-top: 32px;
        }

        .btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2DE5F6 0%, #000618 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 6, 24, 0.4);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 6, 24, 0.6);
        }

        .btn-primary:disabled {
            background: #9CA3AF;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.9);
            color: #6B7280;
            border: 2px solid #E5E7EB;
        }

        .btn-secondary:hover {
            background: white;
            border-color: #2DE5F6;
            color: #2DE5F6;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            max-width: 280px;
            margin: 0 20px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #E5E7EB;
            border-top: 4px solid #2DE5F6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 16px;
            font-weight: 500;
            color: #1F2937;
            margin-bottom: 8px;
        }

        .loading-desc {
            font-size: 14px;
            color: #6B7280;
        }

        /* 响应式设计 */
        @media (max-width: 640px) {
            body {
                padding: 16px;
            }
            
            .simple-container {
                padding: 24px;
                border-radius: 20px;
            }
            
            .title {
                font-size: 24px;
            }
            
            .memory-textarea {
                min-height: 250px;
                padding: 20px;
                font-size: 15px;
            }
            
            .action-buttons {
                flex-direction: column;
            }
        }

        @media (min-width: 1024px) {
            .memory-textarea {
                min-height: 400px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="simple-container">
        <h1 class="title">记忆内容</h1>
        <p class="subtitle">输入您想要记忆的内容，AI将为您生成个性化记忆方案</p>
        <div class="method-selector" id="methodSelector" style="display:flex;align-items:center;gap:12px;margin:12px 0 20px 0;">
            <span class="method-label" id="currentMethodLabel" style="display:inline-block;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:6px 12px;border-radius:16px;font-size:12px;font-weight:600;">当前方法：联想记忆法</span>
            <button class="btn btn-secondary" style="flex:0 0 auto;padding:8px 14px;font-size:14px;border-radius:10px" onclick="openMethodSelection()">选择记忆方法</button>
        </div>
        
        <div class="input-wrapper">
            <textarea 
                id="memoryContent" 
                class="memory-textarea" 
                placeholder="请输入您想要记忆的内容，例如：英语单词、历史事件、公式定理、诗词歌赋等任何您想要记住的内容..."
                maxlength="2000"
            ></textarea>
            <div class="char-counter">
                <span id="charCount">0</span>/2000
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-secondary" onclick="clearContent()">清空</button>
            <button class="btn btn-primary" id="processBtn" onclick="processMemory()" disabled>
                开始记忆
            </button>
        </div>
    </div>

    <!-- 加载遮罩 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text">AI正在处理中...</div>
            <div class="loading-desc">请稍候，正在为您生成个性化记忆方案</div>
        </div>
    </div>

    <script>
        let selectedMethod = { id: 1, name: '联想记忆法', icon: '🔗', description: '通过建立事物之间的联系来增强记忆效果' };

        document.addEventListener('DOMContentLoaded', function() {
            const contentInput = document.getElementById('memoryContent');
            const charCount = document.getElementById('charCount');
            const processBtn = document.getElementById('processBtn');
            const savedMethodStr = localStorage.getItem('selectedMethod');
            if (savedMethodStr) {
                try {
                    const savedM = JSON.parse(savedMethodStr);
                    if (savedM && savedM.id) {
                        selectedMethod = savedM;
                    }
                } catch (e) {}
            }
            const label = document.getElementById('currentMethodLabel');
            if (label) {
                label.textContent = `当前方法：${selectedMethod.name || '联想记忆法'}`;
            }

            // 从localStorage恢复之前的内容
            const savedContent = localStorage.getItem('memoryContent');
            
            if (savedContent) {
                contentInput.value = savedContent;
                const length = savedContent.length;
                charCount.textContent = length;
                processBtn.disabled = length === 0;
            }

            // 监听输入变化
            contentInput.addEventListener('input', function() {
                const length = this.value.length;
                charCount.textContent = length;
                processBtn.disabled = length === 0;
                
                // 实时保存内容到localStorage
                if (this.value.trim()) {
                    localStorage.setItem('memoryContent', this.value);
                } else {
                    localStorage.removeItem('memoryContent');
                }

                // 更新字符计数器样式
                updateCharCounterStyle(length);
            });

            // 从URL参数获取预设内容
            const urlParams = new URLSearchParams(window.location.search);
            const presetContent = urlParams.get('content');
            if (presetContent) {
                contentInput.value = decodeURIComponent(presetContent);
                contentInput.dispatchEvent(new Event('input'));
            }
        });

        function openMethodSelection() {
            if (parent && parent.showPage) {
                parent.showPage('methods');
                return;
            }
            if (parent && parent.navigateTo) {
                parent.navigateTo('methods');
                return;
            }
            window.location.href = 'methods.html';
        }

        function updateCharCounterStyle(length) {
            const counter = document.getElementById('charCount');
            if (!counter) return;
            
            const counterWrapper = counter.parentElement;
            if (!counterWrapper) return;
            
            if (length > 1800) {
                counterWrapper.className = 'char-counter danger';
            } else if (length > 1500) {
                counterWrapper.className = 'char-counter warning';
            } else {
                counterWrapper.className = 'char-counter';
            }
        }

        function clearContent() {
            try {
                const contentInput = document.getElementById('memoryContent');
                const charCount = document.getElementById('charCount');
                const processBtn = document.getElementById('processBtn');
                
                if (contentInput) contentInput.value = '';
                if (charCount) charCount.textContent = '0';
                if (processBtn) processBtn.disabled = true;
                
                // 清除localStorage中保存的内容
                localStorage.removeItem('memoryContent');
                localStorage.removeItem('selectedMethod');
                localStorage.removeItem('contentType');
                
                // 重置字符计数器样式
                if (charCount && charCount.parentElement) {
                    charCount.parentElement.className = 'char-counter';
                }
                
                // 显示清除成功提示
                if (window.parent && window.parent.showToast) {
                    window.parent.showToast('内容已清除', 'success', 2000);
                }
            } catch (error) {
                console.error('清空内容时出错:', error);
            }
        }

        async function processMemory() {
            try {
                const content = document.getElementById('memoryContent').value.trim();
                if (!content) return;

                const loadingOverlay = document.getElementById('loadingOverlay');
                if (loadingOverlay) {
                    loadingOverlay.style.display = 'flex';
                }

                const apiConfig = localStorage.getItem('apiConfig');
                let hasApiConfig = false;
                
                if (apiConfig) {
                    try {
                        const config = JSON.parse(apiConfig);
                        hasApiConfig = config && config.token && config.token.trim() !== '';
                    } catch (e) {}
                }
                
                if (!hasApiConfig) {
                    const loadingOverlay = document.getElementById('loadingOverlay');
                    if (loadingOverlay) {
                        loadingOverlay.style.display = 'none';
                    }
                    
                    const shouldGoToSettings = confirm('⚠️ 尚未配置API或API配置不完整\n\n要使用AI智能记忆功能，请先完成API配置。\n\n是否前往设置页面配置API？');
                    
                    if (shouldGoToSettings) {
                        if (parent && parent.navigateTo) {
                            parent.navigateTo('settings');
                        } else {
                            window.location.href = 'settings.html';
                        }
                    }
                    return;
                }

                localStorage.setItem('memoryContent', content);
                localStorage.setItem('selectedMethod', JSON.stringify(selectedMethod));
                localStorage.setItem('contentType', '综合知识');
                localStorage.setItem('processingStartTime', new Date().toISOString());

                if (parent && parent.showPage) {
                    parent.showPage('processing');
                } else if (parent && parent.navigateTo) {
                    parent.navigateTo('processing');
                } else {
                    window.location.href = 'processing.html';
                }
            } catch (error) {
                console.error('处理失败:', error);
                alert('处理失败，请重试');
            } finally {
                const loadingOverlay = document.getElementById('loadingOverlay');
                if (loadingOverlay) {
                    loadingOverlay.style.display = 'none';
                }
            }
        }
    </script>
</body>
</html>
